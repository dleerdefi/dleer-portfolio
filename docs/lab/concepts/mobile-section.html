<script>
const PRESETS = {"tokyo-night":{"name":"Tokyo Night","accent":"#a855f7"},"nord":{"name":"Nord","accent":"#3b82f6"},"solarized-light":{"name":"Solarized Light","accent":"#ec4899"}};
const ACCENTS = {"rose":"#f43f5e","pink":"#ec4899","fuchsia":"#d946ef","purple":"#a855f7","violet":"#8b5cf6","indigo":"#6366f1","blue":"#3b82f6","sky":"#0ea5e9","cyan":"#06b6d4","teal":"#14b8a6","emerald":"#10b981","green":"#22c55e","lime":"#84cc16","amber":"#f59e0b","orange":"#f97316"};
function apply() {
  const q = new URLSearchParams(location.hash.slice(1));
  const preset = PRESETS[q.get('preset')] ? q.get('preset') : 'tokyo-night';
  const accent = ACCENTS[q.get('accent')] || q.get('accentHex') || PRESETS[preset].accent;
  const root = document.documentElement;
  root.dataset.preset = preset;
  root.style.setProperty('--accent-color', accent);
  const n = parseInt(accent.slice(1), 16);
  root.style.setProperty('--accent-color-rgb', [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(', '));
  document.querySelectorAll('img[src*="globe-"]').forEach((img) => { img.src = 'assets/globe-' + preset + '.svg'; });
  document.body.innerHTML = document.body.innerHTML.replaceAll('__PRESET_NAME__', PRESETS[preset].name).replaceAll('__ACCENT__', accent);
  document.querySelectorAll('[data-accent-swatch]').forEach((s) => { s.style.outline = s.dataset.accentSwatch.toLowerCase() === accent.toLowerCase() ? '2px solid var(--theme-text)' : ''; s.style.outlineOffset = '1px'; });
}
apply();
</script>
