# Railway configuration for Next.js deployment
# https://docs.railway.app/deploy/config-as-code

# [build] section removed to allow Railway auto-detection (Railpack/Nixpacks)
# Railpack automatically injects NEXT_PUBLIC_* environment variables at build time
# Uses standard Next.js build (not standalone)

[deploy]
# Memory-tuned start command (same `next start` server, ~65% less RAM):
# - Run next directly instead of `npm run start`, so no idle npm parent
#   process (~60 MB) sits in front of the server. `exec` makes Next PID 1
#   so it receives SIGTERM directly on redeploys.
# - MALLOC_ARENA_MAX / MALLOC_MMAP_THRESHOLD_ stop glibc from fragmenting
#   and hoarding the native memory sharp uses for /_next/image resizing.
#   Without them RSS grows ~300 MB after the first image requests and is
#   never returned to the OS.
# Railpack runs the start command in a shell, so the env prefix works.
startCommand = "MALLOC_ARENA_MAX=2 MALLOC_MMAP_THRESHOLD_=131072 exec node_modules/.bin/next start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
